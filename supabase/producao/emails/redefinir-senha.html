<!-- Supabase → Authentication → Emails → "Reset password". Assunto: Redefina sua senha do Resolve Aqui -->
<h2>Redefinir senha</h2>
<p>Recebemos um pedido para trocar a senha da sua conta no Resolve Aqui. Toque no botão abaixo para escolher uma nova:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
      style="display:inline-block;background:#0f5f73;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Criar nova senha</a></p>
<p>Se não foi você, ignore este e-mail: sua senha continua a mesma.</p>
