<!-- Supabase → Authentication → Emails → "Confirm signup". Assunto: Confirme seu cadastro no Resolve Aqui -->
<h2>Falta pouco!</h2>
<p>Olá! Para ativar sua conta no Resolve Aqui, toque no botão abaixo:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
      style="display:inline-block;background:#0f5f73;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Confirmar meu e-mail</a></p>
<p>O link funciona em qualquer aparelho. Se você não criou uma conta, ignore este e-mail.</p>
