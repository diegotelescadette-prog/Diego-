const icon = (d, size = 24) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const WA = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2s.2-1.1.1-1.2-.2-.2-.5-.3z"/></svg>';
const PIN = 'M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12zM12 11.5a2.5 2.5 0 1 0 .01 0';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const inSentence = n => (n.length > 1 && n[1] === n[1].toLowerCase()) ? n[0].toLowerCase() + n.slice(1) : n;
const msgUrgent = (svc, nb) => `Olá! Encontrei seu perfil no Resolve Aqui. Preciso de ${inSentence(svc)} hoje ${nb ? `no bairro ${nb}, em Campo Grande` : 'em Campo Grande'}. Qual horário você consegue atender?`;
const msgGeneral = (svc, place, online) => `Olá! Encontrei seu perfil no Resolve Aqui. Preciso de ${inSentence(svc)} ${online ? 'com atendimento online' : 'em ' + place}. Você tem disponibilidade?`;
const midnight = () => { const d = new Date(); return d.getTime() + 3600e3 * 12; }; // simulado: vale "até a meia-noite"

let S;
function reset() {
  S = {
    view: 'home', params: {}, user: null, favs: new Set(), notice: null,
    providers: D.demo.map(p => ({
      key: p.key, name: p.name, color: p.color, services: p.services, main: p.main, areas: p.areas || [],
      wholeCity: !!p.wholeCity, online: !!p.online, status: p.status || 'published', bio: p.bio, ref: p.ref,
      today: p.today && !(p.status && p.status !== 'published') ? { svcs: p.services.filter(s => SVC[s].m !== 'online'), nbs: p.today.neighborhoods || [], whole: !!p.today.wholeCity, exp: midnight() } : null,
    })),
    draft: null,
  };
}
reset();
const P = k => S.providers.find(p => p.key === k);
const me = () => S.user && P('me');
const active = p => p.status === 'published' && p.today && p.today.exp > Date.now();
const areaLabel = p => {
  const parts = [];
  if (p.wholeCity) parts.push('Atende toda Campo Grande');
  else if (p.areas.length) { const n = p.areas.map(a => NB[a]).sort((a, b) => a.localeCompare(b)); parts.push('Atende: ' + (n.length <= 3 ? n.join(', ') : `${n[0]}, ${n[1]} e mais ${n.length - 2} bairros`)); }
  if (p.online) parts.push('Atendimento online');
  return parts.join(' · ');
};
const todayLabel = p => p.today.whole ? 'Atende toda Campo Grande' : 'Atende: ' + p.today.nbs.map(a => NB[a]).sort((a, b) => a.localeCompare(b)).join(', ');
const initials = n => n.replace('(demo)', '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const avatar = (p, big) => `<span class="av${big ? ' big' : ''}" style="background:linear-gradient(145deg,${esc(p.color)},color-mix(in srgb,${esc(p.color)} 55%,#000))" aria-hidden="true">${esc(initials(p.name))}</span>`;

function urgentMatch(p, svc, nb) {
  return active(p) && SVC[svc]?.u && p.today.svcs.includes(svc) && p.services.includes(svc)
    && (!nb || ((p.today.whole || p.today.nbs.includes(nb)) && (p.wholeCity || p.areas.includes(nb))));
}
function matchedServices(q) {
  const qn = norm(q); if (qn.length < 2) return [];
  const out = new Set();
  for (const s of ALL) { const n = norm(s.n); if (n.includes(qn) || (` ${qn} `).includes(` ${n}`)) out.add(s.s); }
  for (const [s, terms] of Object.entries(D.syn)) for (const t of terms) { const tn = norm(t); if ((` ${qn} `).includes(` ${tn}`) || (qn.length >= 3 && tn.startsWith(qn))) out.add(s); }
  return [...out];
}
function search({ q, svc, nb, online, hoje, cat }) {
  const qn = norm(q), m = matchedServices(q);
  return S.providers.filter(p => p.status === 'published'
    && (!svc || p.services.includes(svc))
    && (cat === undefined || cat === '' || p.services.some(x => catIndex(x) === +cat))
    && (!qn || norm(p.name).includes(qn) || p.services.some(s => m.includes(s)))
    && (!online || p.online)
    && (p.online || p.wholeCity || p.areas.length > 0) // a área escolhida define onde aparece
    && (online || !nb || p.wholeCity || p.areas.includes(nb))
    && (!hoje || (active(p) && (!svc || p.today.svcs.includes(svc)) && (!nb || p.today.whole || p.today.nbs.includes(nb)))))
    .sort((a, b) => active(b) - active(a));
}

/* ---------- views ---------- */
function go(view, params = {}) { S.view = view; S.params = params; render(); window.scrollTo(0, 0); }
const nbOptions = sel => `<option value="" ${sel ? '' : 'selected'}>Todos os bairros</option>` + D.nbs.map(([n, s]) => `<option value="${s}" ${s === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');

function urgentForm(svc, nb) {
  return `<form data-form="hoje" class="stack">
    <fieldset class="svcpick"><legend class="lbl" style="font-size:16px;margin-bottom:8px">1. Do que você precisa hoje?</legend>
    <div class="sb-row svc-filter">${icon('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',18)}<input type="search" data-filter="svc" placeholder="Filtrar: pintor, diarista, montador…" aria-label="Filtrar serviços" autocomplete="off"></div>
    <div class="svclist" role="radiogroup" aria-label="Serviços">
      ${D.cats.map((c, ci) => { const items = c.svcs.filter(x => x.m !== 'online'); return items.length ? `<div class="svcgroup"><p class="cat">${esc(c.n)}</p>${items.map(x => `<label class="svcopt" data-n="${esc(norm(x.n + ' ' + c.n + ' ' + (D.syn[x.s] || []).join(' ')))}"><input type="radio" name="svc" value="${x.s}" ${x.s === svc ? 'checked' : ''}><span class="ic sm" style="--t:${CAT_TINT[ci]}">${icon(CAT_ICON[ci], 14)}</span><span>${esc(x.n)}</span></label>`).join('')}</div>` : ''; }).join('')}
      <p class="small muted svc-none" hidden>Nenhum serviço com esse nome. Tente outra palavra.</p>
    </div></fieldset>
    <div><label class="lbl" for="f-nb" style="font-size:16px">2. Em qual bairro?</label>
    <select id="f-nb" name="nb" class="input">${nbOptions(nb)}</select></div>
    <p class="err" data-err hidden></p>
    <button class="btn hoje block big">Ver quem atende hoje</button></form>`;
}

function vHome() {
  const online = S.providers.filter(active).length;
  return `<div class="stack" style="gap:24px">
  <section class="band" aria-labelledby="t1"><div class="band-in">
    <span class="chip city-dark">${icon(PIN,16)} Campo Grande–MS</span>
    <h1 id="t1">Preciso para hoje</h1>
    <p class="lead">Encontre quem atende no seu bairro e confirmou disponibilidade para hoje.</p>

  </div></section>

    <p class="small muted" style="margin-top:12px;display:flex;gap:6px;align-items:center"><span style="color:var(--zap)">${WA}</span>Sem cadastro: um toque e você fala com o profissional.</p></section>
  <form data-form="busca-home" class="searchbar" role="search"><label for="q-home" class="lbl">Buscar prestadores</label>

  <section aria-labelledby="cats"><h2 id="cats">Explore por categoria</h2>
    <div class="cats">${D.cats.map((c, i) => `<button class="catbtn" data-act="cat" data-i="${i}"><span class="ic" style="--t:${CAT_TINT[i]}">${icon(CAT_ICON[i])}</span><span>${esc(c.n)}</span></button>`).join('')}</div></section>
  <section class="card pro"><div style="flex:1;min-width:0"><h2>Você é prestador?</h2><p class="muted">Crie seu perfil em 2 etapas pelo celular, escolha os bairros e avise quando atende hoje.</p></div>
    <button class="btn hoje" data-act="sou">Cadastrar meu perfil</button></section>

}

function pcard(p, { svcName, area, today, act, extra = '' }) {
  return `<li><div class="pc" role="button" tabindex="0" data-act="${act}" data-k="${p.key}" aria-label="Chamar ${esc(p.name)} no WhatsApp">

    <div class="pc-body"><h3>${esc(p.name)}</h3>
      <p class="pc-svc"><span class="ic sm" style="--t:${CAT_TINT[catIndex(p.main)]}">${icon(CAT_ICON[catIndex(p.main)], 14)}</span>${esc(svcName)}</p>
      <p class="small muted pc-area">${icon(PIN, 14)} ${esc(area)}</p>
      ${today ? `<p class="pc-today"><span class="badge"><span class="dot"></span>Atende hoje</span>${today === 'urg' ? '<span class="small muted">Horário a combinar pelo WhatsApp</span>' : ''}</p>` : ''}
      ${extra}
    </div>
    <span class="pc-wa" aria-hidden="true">${WA}</span></div></li>`;
}
function vHoje() {

    <h1>${esc(s.n)} para hoje</h1>

       <div class="row">${nb ? `<button class="btn hoje" data-act="go" data-v="hoje" data-svc="${svc}" data-nb="">Buscar em toda Campo Grande</button>` : ''}<button class="btn outline" data-act="busca" data-svc="${svc}" data-nb="${nb || ''}">Ver todos os prestadores desse serviço</button></div></div>`}
  </div>`;
}

function vNaoPiloto() {
  const s = SVC[S.params.svc];
  return `<div class="card stack"><p style="font-weight:700">${esc(s.n)} é atendido online, então não entra no “Preciso para hoje”.</p>

function vBusca() {
  const f = { q: '', svc: '', nb: '', online: false, hoje: false, ...S.params };
  const res = search(f), m = f.q ? matchedServices(f.q).map(s => SVC[s].n) : [];
  const chips = [];
  if (f.cat !== undefined && f.cat !== '') chips.push(['Categoria: ' + D.cats[f.cat].n, { cat: '' }]);
  if (f.svc) chips.push(['Serviço: ' + SVC[f.svc].n, { svc: '' }]);
  if (f.nb) chips.push(['Bairro: ' + NB[f.nb], { nb: '' }]);
  if (f.online) chips.push(['Atendimento online', { online: false }]);
  if (f.hoje) chips.push(['Atende hoje', { hoje: false }]);
  const enc = o => esc(JSON.stringify(o));
  return `<div class="stack"><h1>Buscar prestadores</h1>
  <form data-form="busca-q" class="row" role="search" style="flex-wrap:nowrap"><label class="sr" for="q" hidden>Nome, serviço ou problema</label>

  <div class="searchgrid">

      <div><label class="lbl" for="f-svc">Serviço</label><select id="f-svc" name="svc" class="input"><option value="">Todos os serviços</option>
        ${D.cats.map(c => `<optgroup label="${esc(c.n)}">${c.svcs.map(s => `<option value="${s.s}" ${s.s === f.svc ? 'selected' : ''}>${esc(s.n)}</option>`).join('')}</optgroup>`).join('')}</select></div>
      <div><label class="lbl" for="f-city">Cidade</label><select id="f-city" class="input" disabled><option>Campo Grande–MS</option></select></div>
      <div><label class="lbl" for="f-bairro">Bairro</label><select id="f-bairro" name="nb" class="input"><option value="">Todos os bairros</option>${D.nbs.map(([n, s]) => `<option value="${s}" ${s === f.nb ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
      <label class="row"><input type="checkbox" name="online" ${f.online ? 'checked' : ''}> Atendimento online</label>
      <label class="row"><input type="checkbox" name="hoje" ${f.hoje ? 'checked' : ''}> Atende hoje</label>
      <button class="btn primary">Aplicar filtros</button></form></div>
    <section class="stack" aria-live="polite" style="min-width:0">
      ${chips.length ? `<div class="row">${chips.map(([l, r]) => `<button class="chip" data-act="unfilter" data-r="${enc(r)}" aria-label="Remover filtro ${esc(l)}">${esc(l)} ✕</button>`).join('')}<button class="btn ghost small" data-act="unfilter" data-r="${enc({ svc: '', nb: '', online: false, hoje: false, cat: '' })}">Limpar filtros</button></div>` : ''}
      ${m.length ? `<p class="small muted">“${esc(f.q)}” inclui: ${esc(m.join(', '))}</p>` : ''}
      ${res.length ? `<p class="muted">${res.length === 1 ? '1 prestador encontrado' : res.length + ' prestadores encontrados'}</p>
        <ul class="plist">${res.map(p => pcard(p, { svcName: SVC[p.main].n, area: areaLabel(p), today: active(p) ? 'geral' : '', act: 'zap-card',
          extra: `<button class="link" data-act="perfil" data-k="${p.key}" data-svc="${f.svc}" data-nb="${f.nb}" data-online="${f.online ? 1 : ''}">Ver perfil</button>` })).join('')}</ul>
        ${f.nb && res.length < 3 ? `<p class="card small" style="background:var(--brand-soft)">Poucos resultados no bairro. <button class="btn ghost small" data-act="unfilter" data-r="${enc({ nb: '' })}">Ampliar para toda Campo Grande</button></p>` : ''}`
      : `<div class="card stack"><p style="font-weight:700">Nenhum prestador encontrado${f.q ? ` para “${esc(f.q)}”` : ''}.</p><p class="muted">Tente retirar um filtro ou procurar na cidade inteira:</p>
         <div class="row">${f.nb ? `<button class="btn primary" data-act="unfilter" data-r="${enc({ nb: '' })}">Buscar em toda Campo Grande</button>` : ''}
         ${chips.filter(c => !c[0].startsWith('Bairro')).map(([l, r]) => `<button class="btn outline" data-act="unfilter" data-r="${enc(r)}">Retirar “${esc(l)}”</button>`).join('')}
         ${f.q ? `<button class="btn ghost" data-act="unfilter" data-r="${enc({ q: '' })}">Buscar sem o termo</button>` : ''}</div></div>`}
    </section></div></div>`;
}

function vPerfil() {

      <p class="muted pc-area">${icon(PIN,16)} ${esc(areaLabel(p))}</p>

    <details class="card"><summary style="cursor:pointer;font-weight:600">Denunciar perfil</summary><div class="stack" style="margin-top:12px">
    ${S.user ? (S.reported?.has(p.key) ? '<p class="ok">Denúncia enviada. Obrigado por ajudar a manter a comunidade segura.</p>' : `<label class="lbl" for="motivo">Motivo</label><select id="motivo" class="input"><option>Informações falsas</option><option>Golpe ou cobrança indevida</option><option>Comportamento inadequado</option><option>Outro</option></select><button class="btn outline" style="border-color:var(--danger);color:var(--danger)" data-act="denunciar" data-k="${p.key}">Enviar denúncia</button>`)
      : `<button class="btn outline" data-act="login" data-why="denuncia">Entre para denunciar</button>`}</div></details>` : ''}
  <button class="btn ghost" data-act="back">← Voltar</button></div>`;
}

function stepper(n) { return `<div class="steps" aria-label="Etapas">${['Seu perfil', 'Onde você atende', 'Prévia'].map((l, i) => `<span class="${i + 1 === n ? 'on' : ''}">${l}</span>`).join('')}</div>`; }

function vEtapa1() {
  const d = S.draft, e = S.params.errors || {};
  const fq = norm(S.params.sf || '');
  return `<div class="stack">${stepper(1)}<h1>Seu perfil</h1>
  <form data-form="etapa1" class="card stack" novalidate>
    <div><label class="lbl" for="dn">Nome profissional</label><input id="dn" name="name" class="input" value="${esc(d.name)}" aria-invalid="${!!e.name}" placeholder="Ex.: João Encanador">${e.name ? `<p class="err">${e.name}</p>` : ''}</div>
    <div class="row"><span class="av" style="background:${d.color}" aria-hidden="true">${esc(initials(d.name || '?'))}</span><p class="small muted" style="flex:1">Foto de perfil: no app real você envia uma foto (removemos a localização GPS). Aqui usamos as iniciais.</p></div>
    <div><label class="lbl" for="ph">Telefone e WhatsApp com DDD</label><input id="ph" name="phone" class="input" inputmode="tel" value="${esc(d.phone)}" placeholder="(67) 99999-1234" aria-invalid="${!!e.phone}"><p class="small muted">Não aparece no perfil nem na busca.</p>${e.phone ? `<p class="err">${e.phone}</p>` : ''}</div>
    <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="lbl">Serviços que você oferece</legend>
      <input class="input" type="search" data-input="sf" value="${esc(S.params.sf || '')}" placeholder="Procurar serviço (ex.: pintor)" aria-label="Procurar serviço">
      ${d.services.length ? `<div class="row">${d.services.map(s => `<button type="button" class="chip" data-act="unsvc" data-s="${s}">${esc(SVC[s].n)} ✕</button>`).join('')}</div>` : ''}
      <div class="list">${D.cats.map(c => { const it = c.svcs.filter(s => !fq || norm(s.n).includes(fq)); return it.length ? `<div class="cat">${esc(c.n)}</div>` + it.map(s => `<label><input type="checkbox" data-act="svc" data-s="${s.s}" ${d.services.includes(s.s) ? 'checked' : ''}> ${esc(s.n)}${s.m !== 'presencial' ? ` <span class="small muted">(${s.m === 'online' ? 'online' : 'presencial ou online'})</span>` : ''}</label>`).join('') : ''; }).join('')}</div>
      ${e.services ? `<p class="err">${e.services}</p>` : ''}
      ${d.services.length > 1 ? `<div><label class="lbl" for="main">Serviço principal</label><select id="main" name="main" class="input">${d.services.map(s => `<option value="${s}" ${s === d.main ? 'selected' : ''}>${esc(SVC[s].n)}</option>`).join('')}</select></div>` : ''}
    </fieldset>
    <div><label class="lbl" for="bio">Descrição curta (opcional)</label><textarea id="bio" name="bio" class="input" maxlength="600">${esc(d.bio)}</textarea></div>
    ${Object.keys(e).length ? '<p class="alert" role="alert">Corrija os campos destacados.</p>' : ''}
    <button class="btn primary">Salvar e continuar</button></form></div>`;
}

function vEtapa2() {
  const d = S.draft, e = S.params.errors || {}, fq = norm(S.params.nf || '');
  const canOnline = d.services.some(s => SVC[s].m !== 'presencial');
  return `<div class="stack">${stepper(2)}<h1>Onde você atende</h1>
  <form data-form="etapa2" class="card stack" novalidate>
    <div><h2 style="font-size:17px">Endereço de referência</h2><p class="small muted">Privado. Os clientes veem só a região que você atende.</p></div>
    <div class="grid2"><div><label class="lbl" for="cep">CEP</label><input id="cep" name="cep" class="input" inputmode="numeric" value="${esc(d.cep)}" placeholder="79002-000" aria-invalid="${!!e.cep}">${e.cep ? `<p class="err">${e.cep}</p>` : ''}</div>
    <div><label class="lbl" for="rua">Rua e número</label><input id="rua" name="rua" class="input" value="${esc(d.rua)}" aria-invalid="${!!e.rua}">${e.rua ? `<p class="err">${e.rua}</p>` : ''}</div></div>
    <div><h2 style="font-size:17px">Área de atendimento</h2><p class="small muted">Onde você vai até o cliente, em Campo Grande–MS.</p></div>
    <div class="grid2"><label class="area-opt"><input type="radio" name="mode" value="cidade" data-act="mode" ${d.wholeCity ? 'checked' : ''}><span><strong>Atendo em toda Campo Grande</strong><span class="small muted" style="display:block">Um clique e você aparece em qualquer bairro.</span></span></label>
      <label class="area-opt"><input type="radio" name="mode" value="bairros" data-act="mode" ${!d.wholeCity ? 'checked' : ''}><span><strong>Atendo em bairros selecionados</strong><span class="small muted" style="display:block">Escolha um ou mais bairros.</span></span></label></div>
    ${d.wholeCity ? '' : `<input class="input" type="search" data-input="nf" value="${esc(S.params.nf || '')}" placeholder="Procurar bairro" aria-label="Procurar bairro">
      <p class="small muted">${d.areas.length} selecionado(s)</p>
      <div class="list">${D.nbs.filter(([n]) => !fq || norm(n).includes(fq)).map(([n, s]) => `<label><input type="checkbox" data-act="area" data-s="${s}" ${d.areas.includes(s) ? 'checked' : ''}> ${esc(n)}</label>`).join('')}</div>`}
    ${e.areas ? `<p class="err">${e.areas}</p>` : ''}
    ${canOnline ? `<label class="row"><input type="checkbox" name="online" ${d.online ? 'checked' : ''}> Também atendo online</label>` : ''}
    <div class="row"><button type="button" class="btn ghost" data-act="go" data-v="etapa1">← Voltar</button><button class="btn primary" style="flex:1">Ver prévia do perfil</button></div></form></div>`;
}

function vPrevia() {
  const d = S.draft, tmp = { ...d, key: 'preview' };
  return `<div class="stack">${stepper(3)}<h1>Prévia do seu perfil</h1>
  <p class="muted">Assim você aparece na busca:</p>
  <div class="card pcard">${avatar(tmp)}<div><h3>${esc(d.name)}</h3><p>${esc(SVC[d.main].n)}</p><p class="small muted">${esc(areaLabel(tmp))}</p></div></div>
  <p class="small muted">Telefone e endereço de referência não aparecem para os clientes.</p>
  <button class="btn hoje" data-act="publicar">Publicar meu perfil</button>
  <button class="btn ghost" data-act="go" data-v="etapa2">← Editar área</button></div>`;
}

function vPainel() {
  const p = me(); if (!p) return vEtapa1();
  const st = { published: 'Publicado', paused: 'Pausado', draft: 'Rascunho', suspended: 'Suspenso' }[p.status];
  const inPerson = p.services.filter(s => SVC[s].m !== 'online'), elig = inPerson.filter(s => SVC[s].u);
  const r = S.params.restrict;
  const info = `<p class="small muted">Ao ativar, visitantes sem cadastro podem te chamar no WhatsApp pelo <strong>“Preciso para hoje”</strong>${elig.length ? ` nos seus serviços presenciais: ${elig.map(s => SVC[s].n).join(', ')}` : ' (vale para serviços feitos no local); seus serviços online aparecem com “Atende hoje” na busca geral'}. Vale até a meia-noite (horário de Campo Grande).</p>`;
  return `<div class="stack"><h1>Painel do prestador</h1>
  ${S.params.published ? '<p class="ok" role="status">Perfil publicado! Agora você aparece na busca.</p>' : ''}
  <section class="card stack"><p style="font-size:18px">Estado do perfil: <span class="status st-${p.status}">${st}</span></p>
    <p class="muted">${p.status === 'published' ? 'Seu perfil aparece na busca.' : 'Seu perfil está oculto da busca até você reativar.'}</p>
    <div class="row"><button class="btn outline" data-act="editar">Editar perfil</button><button class="btn ghost" data-act="perfil" data-k="me">Ver como aparece</button>
    ${p.status === 'published' ? '<button class="btn ghost" data-act="status" data-s="paused">Pausar publicação</button>' : '<button class="btn primary" data-act="status" data-s="published">Reativar publicação</button>'}</div></section>
  <section class="card stack" style="border-color:color-mix(in srgb,var(--hoje) 40%,var(--line))"><h2>Atendo hoje</h2>
  ${p.status !== 'published' ? '<p class="muted">Disponível quando o perfil estiver Publicado.</p>' : !inPerson.length ? '<p class="muted">Vale para serviços presenciais.</p>' : active(p) ? `
    <p style="font-weight:700;color:var(--hoje-strong)"><span class="badge">● Atendo hoje</span> ativo até 23:59 de hoje (horário de Campo Grande)</p>
    <div><p style="font-weight:600">Serviços incluídos</p><div class="row">${p.today.svcs.map(s => `<span class="chip" style="cursor:default">${esc(SVC[s].n)}${SVC[s].u ? ' · contato sem login' : ''}</span>`).join('')}</div></div>
    <div><p style="font-weight:600">Área de hoje</p><p class="muted">${esc(todayLabel(p))}</p></div>${info}
    <button class="btn outline" data-act="off">Desativar “Atendo hoje”</button>` : `${info}
    <button type="button" class="btn ghost small" style="align-self:flex-start;padding-left:0" data-act="restrict">${r ? 'Usar meus serviços e área cadastrados' : 'Restringir serviços ou bairros só para hoje'}</button>
    ${r ? `<div class="stack"><p class="lbl">Serviços de hoje</p>${inPerson.map(s => `<label class="row"><input type="checkbox" data-today-svc="${s}" checked> ${esc(SVC[s].n)}</label>`).join('')}
      ${p.wholeCity ? '<p class="small muted">Você atende toda a cidade; hoje vale para toda Campo Grande.</p>' : `<p class="lbl">Bairros de hoje</p>${p.areas.map(a => `<label class="row"><input type="checkbox" data-today-nb="${a}" checked> ${esc(NB[a])}</label>`).join('')}`}</div>` : ''}
    <p class="err" data-err hidden></p>
    <button class="btn hoje" data-act="on">Atendo hoje</button>`}
  </section></div>`;
}

function vFavs() {
  const l = S.providers.filter(p => S.favs.has(p.key) && p.status === 'published');
  return `<div class="stack"><h1>Meus favoritos</h1>${l.length ? l.map(p => `<div class="card pcard">${avatar(p)}<div><h3>${esc(p.name)}</h3><p>${esc(SVC[p.main].n)}</p><button class="btn ghost small" style="padding-left:0" data-act="perfil" data-k="${p.key}">Ver perfil →</button></div></div>`).join('')
    : '<div class="card stack"><p>Você ainda não salvou nenhum prestador.</p><button class="btn primary" data-act="busca">Buscar prestadores</button></div>'}</div>`;
}

function header() {
  return `<header class="top"><div class="wrap"><button class="logo" data-act="go" data-v="home" aria-label="Página inicial">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f5f73"/><path d="M32 12c-8.3 0-15 6.5-15 14.6C17 37.5 32 52 32 52s15-14.5 15-25.4C47 18.5 40.3 12 32 12z" fill="#fff"/><path d="m25 27 5 5 9-10" stroke="#ea580c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Resolve Aqui</button>
    <nav class="main desk" aria-label="Principal"><button class="btn ghost small" data-act="busca">Buscar</button>
    ${S.user ? `<button class="btn ghost small" data-act="go" data-v="favs">Favoritos</button><button class="btn ghost small" data-act="sou">${me() ? 'Painel' : 'Sou prestador'}</button><button class="btn outline small" data-act="sair">Sair</button>`
      : `<button class="btn ghost small" data-act="sou">Sou prestador</button><button class="btn outline small" data-act="login">Entrar</button>`}</nav>
    ${S.user ? '<button class="btn ghost small mob" data-act="sair">Sair</button>' : '<button class="btn outline small mob" data-act="login">Entrar</button>'}</div></header>`;
}
function bottomNav() {
  const it = (v, label, d, act = 'go') => `<button class="bn${S.view === v || (v === 'painel' && ['etapa1','etapa2','previa'].includes(S.view)) ? ' on' : ''}" data-act="${act}" data-v="${v}">${icon(d,22)}<span>${label}</span></button>`;
  return `<nav class="bottom" aria-label="Navegação">${it('home','Início','M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z')}${it('busca','Buscar','M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4','busca')}${it('favs','Favoritos','M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z','favs')}${it('painel', me() ? 'Meu perfil' : 'Sou prestador','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0','sou')}</nav>`;
}

function banner() {
  return `<div class="demo"><div class="wrap"><span><strong>Prévia para teste</strong> com dados fictícios. Nada é salvo nem enviado.${S.user ? ` Conectado como ${esc(S.user)}.` : ''}</span>
  <details><summary>Ferramentas de teste</summary><div class="tools">
    <button class="btn outline small" data-act="t-vencer">Fazer a disponibilidade vencer (simula meia-noite)</button>
    <button class="btn outline small" data-act="t-reset">Reiniciar dados</button></div>
    <p class="small muted" style="margin-top:6px">Dica: abra uma lista do “Preciso para hoje”, toque em “Fazer a disponibilidade vencer” e depois em “Chamar no WhatsApp”.</p></details></div></div>`;
}

let sheet = null;
function render() {
  const V = { home: vHome, hoje: vHoje, naopiloto: vNaoPiloto, busca: vBusca, perfil: vPerfil, entrar: vEntrar, etapa1: vEtapa1, etapa2: vEtapa2, previa: vPrevia, painel: vPainel, favs: vFavs }[S.view];
  document.getElementById('app').innerHTML = banner() + header() + `<main class="wrap">${V()}</main>` + bottomNav() + (sheet ? sheet : '');
  const chk = document.querySelector('.svclist input:checked'); if (chk) { const b = chk.closest('.svclist'); b.scrollTop = chk.closest('label').offsetTop - b.offsetTop - 40; }
}

function openZap(p, text, editable) {
  sheet = `<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="zt">
    <h2 id="zt">WhatsApp de ${esc(p.name)}</h2>
    ${editable ? `<label class="lbl" for="zmsg">Mensagem (você pode editar antes de enviar)</label><textarea id="zmsg" class="input">${esc(text)}</textarea>` : `<div class="bubble">${esc(text)}</div>`}
    <p class="small muted">No app real, este toque abre o WhatsApp com o texto pronto; você pode editar e decide se envia. O número do prestador nunca aparece na página: o link é gerado no servidor.</p>
    <div class="row"><button class="btn zap" style="flex:1" data-act="close">Entendi</button></div></div></div>`;
  render();
  document.getElementById('zmsg')?.focus();
}

function zapGeneralDirect(p) {
  const { svc, nb, online } = S.params, s = SVC[p.services.includes(svc) ? svc : p.main];
  const place = nb ? `${NB[nb]}, Campo Grande` : 'Campo Grande';
  openZap(p, msgGeneral(s.n, place, online || (p.online && !p.areas.length && !p.wholeCity)), false);
}
function needLogin(why, back, signup) { S.back = back; go('entrar', { why, signup }); }

const actions = {
  go: el => go(el.dataset.v, { svc: el.dataset.svc, nb: el.dataset.nb }),
  pick: el => { const f = el.closest('form'); f.svc.value = el.dataset.s; f.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-pressed', t === el)); },
  busca: el => go('busca', { svc: el.dataset.svc || '', nb: el.dataset.nb || '' }),
  perfil: el => { S.prev = { view: S.view, params: S.params }; go('perfil', { k: el.dataset.k, svc: el.dataset.svc, nb: el.dataset.nb, online: !!el.dataset.online, hoje: !!el.dataset.hoje }); },
  back: () => S.prev ? go(S.prev.view, S.prev.params) : go('home'),
  filtros: () => { S.fopen = !S.fopen; render(); },
  unfilter: el => go('busca', { ...S.params, ...JSON.parse(el.dataset.r) }),
  login: el => needLogin(el.dataset.why, { view: S.view, params: S.params }),
  'toggle-signup': () => go('entrar', { ...S.params, signup: !S.params.signup }),
  sair: () => { S.user = null; go('home'); },
  sou: () => { if (!S.user) return needLogin('prestador', { view: 'etapa1' }, true); startProvider(); },
  'zap-urg': el => {
    const p = P(el.dataset.k), { svc, nb } = S.params;
    if (!urgentMatch(p, svc, nb)) { const back = S.view === 'perfil' ? S.prev : null; go('hoje', { svc, nb, changed: p.name }); return; }
    openZap(p, msgUrgent(SVC[svc].n, NB[nb]), false);
  },
  'zap-geral': el => {
    const p = P(el.dataset.k);
    if (!S.user) return needLogin('contato', { view: 'perfil', params: S.params, then: p.key });
    zapGeneralDirect(p);
  },
  'zap-card': el => {
    const p = P(el.dataset.k);
    if (!S.user) return needLogin('contato', { view: 'busca', params: S.params, then: p.key });
    zapGeneralDirect(p);
  },
  cat: el => { const c = D.cats[+el.dataset.i]; go('busca', { cat: +el.dataset.i, q: '' }); },
  favs: () => S.user ? go('favs') : needLogin('favorito', { view: 'favs' }),
  close: () => { sheet = null; render(); },
  'close-bg': (el, ev) => { if (ev.target === el) { sheet = null; render(); } },
  fav: el => { if (!S.user) return needLogin('favorito', { view: 'perfil', params: S.params }); const k = el.dataset.k; S.favs.has(k) ? S.favs.delete(k) : S.favs.add(k); render(); },
  denunciar: el => { (S.reported ||= new Set()).add(el.dataset.k); render(); },
  svc: el => { const d = S.draft, s = el.dataset.s; d.services = el.checked ? [...d.services, s] : d.services.filter(x => x !== s); if (!d.services.includes(d.main)) d.main = d.services[0] || null; keepDraft(); render(); },
  unsvc: el => { const d = S.draft; d.services = d.services.filter(x => x !== el.dataset.s); if (!d.services.includes(d.main)) d.main = d.services[0] || null; keepDraft(); render(); },
  area: el => { const d = S.draft, s = el.dataset.s; d.areas = el.checked ? [...d.areas, s] : d.areas.filter(x => x !== s); keepDraft(); render(); },
  mode: el => { keepDraft(); S.draft.wholeCity = el.value === 'cidade'; render(); },
  publicar: () => {
    const d = S.draft; let p = me();
    if (!p) { p = { key: 'me', status: 'draft', today: null }; S.providers.push(p); }
    Object.assign(p, { name: d.name, color: d.color, services: d.services, main: d.main, areas: d.wholeCity ? [] : d.areas, wholeCity: d.wholeCity, online: d.online, bio: d.bio, status: 'published', today: null });
    go('painel', { published: true });
  },
  editar: () => startProvider(true),
  status: el => { const p = me(); p.status = el.dataset.s; if (p.status !== 'published') p.today = null; render(); },
  restrict: () => { S.params.restrict = !S.params.restrict; S.params.published = false; render(); },
  on: () => {
    const p = me(), inPerson = p.services.filter(s => SVC[s].m !== 'online');
    let svcs = inPerson, nbs = p.areas;
    if (S.params.restrict) { svcs = [...document.querySelectorAll('[data-today-svc]:checked')].map(i => i.dataset.todaySvc); if (!p.wholeCity) nbs = [...document.querySelectorAll('[data-today-nb]:checked')].map(i => i.dataset.todayNb); }
    const err = document.querySelector('[data-err]');
    if (!svcs.length || (!p.wholeCity && !nbs.length)) { err.textContent = !svcs.length ? 'Escolha pelo menos um serviço para hoje.' : 'Escolha pelo menos um bairro para hoje.'; err.hidden = false; return; }
    p.today = { svcs, nbs: p.wholeCity ? [] : nbs, whole: p.wholeCity, exp: midnight() }; S.params.published = false; render();
  },
  off: () => { me().today = null; render(); },
  't-vencer': () => { S.providers.forEach(p => { if (p.today) p.today.exp = 0; }); const t = document.querySelector('.demo details'); t.insertAdjacentHTML('beforeend', '<p class="ok small" style="margin-top:6px">Todas as disponibilidades venceram. A tela ainda não foi atualizada: toque em “Chamar no WhatsApp” para ver o aviso.</p>'); },
  't-reset': () => { reset(); sheet = null; go('home'); },
};

function startProvider(edit) {
  const p = me();
  S.draft = p && edit ? { name: p.name, color: p.color, phone: S.phoneSaved || '', services: [...p.services], main: p.main, bio: p.bio || '', cep: '79002-000', rua: 'Rua Exemplo, 10', areas: [...p.areas], wholeCity: p.wholeCity, online: p.online }
    : p ? null : (S.draft || { name: '', color: '#b45309', phone: '', services: [], main: null, bio: '', cep: '', rua: '', areas: [], wholeCity: false, online: false });
  if (p && !edit) return go('painel');
  go('etapa1');
}
function keepDraft() {
  const f = document.querySelector('form[data-form="etapa1"],form[data-form="etapa2"]'); if (!f) return;
  const d = S.draft;
  if (f.dataset.form === 'etapa1') { d.name = f.name.value; d.phone = f.phone.value; d.bio = f.bio.value; if (f.main) d.main = f.main.value; }
  else { d.cep = f.cep.value; d.rua = f.rua.value; if (f.online) d.online = f.online.checked; }
}
const phoneOk = v => { let d = v.replace(/\D/g, ''); if ((d.length === 12 || d.length === 13) && d.startsWith('55')) d = d.slice(2); return d.length === 11 && d[2] === '9' && Number(d.slice(0, 2)) >= 11; };

const forms = {
  hoje: f => {
    const svc = f.svc.value, nb = f.nb.value, err = f.querySelector('[data-err]');
    if (!svc) { err.textContent = 'Escolha o serviço.'; err.hidden = false; return; }
    go('hoje', { svc, nb });
  },
  'busca-home': f => go('busca', { q: f.q.value.trim() }),
  'busca-q': f => go('busca', { ...S.params, q: f.q.value.trim() }),
  filtros: f => { S.fopen = false; go('busca', { ...S.params, svc: f.svc.value, nb: f.nb.value, online: f.online.checked, hoje: f.hoje.checked }); },
  login: f => {
    const err = f.querySelector('[data-err]'), em = f.email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { err.textContent = 'Informe um e-mail válido.'; err.hidden = false; return; }
    if (f.pw.value.length < 8) { err.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; err.hidden = false; return; }
    S.user = em; const b = S.back; S.back = null;
    if (b?.view === 'etapa1') return startProvider();
    b ? go(b.view, b.params) : go('home');
    if (b?.then) zapGeneralDirect(P(b.then));
  },
  etapa1: f => {
    keepDraft(); const d = S.draft, e = {};
    if (d.name.trim().length < 3) e.name = 'Informe seu nome profissional.';
    if (!phoneOk(d.phone)) e.phone = 'Telefone inválido. Use DDD + celular, ex.: (67) 99999-1234.';
    if (!d.services.length) e.services = 'Escolha pelo menos um serviço.';
    if (Object.keys(e).length) return go('etapa1', { errors: e, sf: S.params.sf });
    S.phoneSaved = d.phone; go('etapa2');
  },
  etapa2: f => {
    keepDraft(); const d = S.draft, e = {};
    if (d.cep.replace(/\D/g, '').length !== 8) e.cep = 'CEP deve ter 8 números.';
    if (d.rua.trim().length < 3) e.rua = 'Informe a rua e o número.';
    if (!d.wholeCity && !d.areas.length && !(d.online && d.services.every(s => SVC[s].m === 'online'))) e.areas = 'Escolha pelo menos um bairro ou marque “Atendo em toda Campo Grande”.';
    if (Object.keys(e).length) return go('etapa2', { errors: e, nf: S.params.nf });
    go('previa');
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = actions[el.dataset.act]; if (!a) return;
  if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio') return;
  if (el.tagName === 'BUTTON') ev.preventDefault();
  a(el, ev);
});
document.addEventListener('submit', ev => { ev.preventDefault(); const f = ev.target; forms[f.dataset.form]?.(f); });
document.addEventListener('input', ev => {
  if (ev.target.dataset.filter === 'svc') {
    const q = norm(ev.target.value), box = ev.target.closest('form').querySelector('.svclist'); let any = false;
    box.querySelectorAll('.svcgroup').forEach(g => { let n = 0; g.querySelectorAll('.svcopt').forEach(o => { const ok = !q || o.dataset.n.includes(q); o.hidden = !ok; if (ok) n++; }); g.hidden = !n; any ||= n > 0; });
    box.querySelector('.svc-none').hidden = any; return;
  }
  const k = ev.target.dataset.input; if (!k) return;
  keepDraft(); const pos = ev.target.selectionStart; S.params[k] = ev.target.value; render();
  const n = document.querySelector(`[data-input="${k}"]`); n.focus(); n.setSelectionRange(pos, pos);
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList?.contains('pc')) { ev.preventDefault(); ev.target.click(); return; } if (ev.key === 'Escape' && sheet) { sheet = null; render(); } });
render();

</script>
